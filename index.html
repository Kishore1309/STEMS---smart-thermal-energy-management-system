<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntelliCell Battery Intelligence</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appBg: '#09090b',
            surfaceBg: '#18181b',
            surfaceBorder: '#27272a',
            primaryText: '#e4e4e7',
            mutedText: '#a1a1aa',
            accentTeal: '#3b82f6',  // Blue 500
            accentYellow: '#eab308', // Yellow 500
            safeGreen: '#22c55e',   // Green 500
            criticalRed: '#ef4444', // Red 500
            dangerBg: 'rgba(239, 68, 68, 0.1)',
          }
        }
      }
    }
  </script>

  <!-- PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    .glass-effect {
      background: rgba(24, 24, 27, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .battery-container {
      position: relative;
      width: 80px;
      height: 160px;
      border: 3px solid #27272a;
      border-radius: 10px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .battery-cap {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 8px;
      background: #27272a;
      border-radius: 4px 4px 0 0;
    }

    .battery-fill {
      width: 100%;
      background: #22c55e;
      border-radius: 4px;
      transition: height 1s ease-out, background 0.5s;
      min-height: 5%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .battery-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      color: white;
      font-size: 1.25rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }
  </style>
</head>

<body class="bg-appBg text-primaryText h-screen flex overflow-hidden">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 bg-surfaceBg border-r border-surfaceBorder flex flex-col z-20 shadow-2xl shrink-0">
    <div class="h-20 flex items-center px-6 border-b border-surfaceBorder mt-2">
      <div class="flex items-center gap-3">
        <i data-lucide="zap" class="text-accentTeal w-6 h-6 fill-accentTeal"></i>
        <div>
          <h1 class="text-lg font-bold leading-tight text-primaryText">IntelliCell</h1>
          <p class="text-xs text-mutedText font-semibold">Battery Intelligence</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-6 flex flex-col gap-2">
      <a href="#" id="navDashboard"
        class="flex items-center gap-3 pl-7 pr-4 py-3 bg-accentTeal/10 text-accentTeal border-l-4 border-accentTeal font-medium transition-all">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
      </a>
      <a href="#" id="navAnalytics"
        class="flex items-center gap-3 px-8 py-3 text-mutedText hover:text-primaryText hover:bg-white/5 font-medium transition-colors">
        <i data-lucide="line-chart" class="w-5 h-5"></i> Analytics
      </a>
      <a href="#" id="navSystem"
        class="flex items-center gap-3 px-8 py-3 text-mutedText hover:text-primaryText hover:bg-white/5 font-medium transition-colors">
        <i data-lucide="cpu" class="w-5 h-5"></i> System
      </a>
      <a href="#"
        class="flex items-center gap-3 px-8 py-3 text-mutedText hover:text-primaryText hover:bg-white/5 font-medium transition-colors hidden">
        <i data-lucide="bell" class="w-5 h-5"></i> Alerts
      </a>
    </nav>

    <!-- Bottom Actions -->
    <div class="p-6 flex flex-col gap-4">
      <button
        class="w-full bg-accentTeal hover:bg-blue-400 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all">
        System Check
      </button>
      <a href="#"
        class="flex items-center gap-3 px-4 py-2 text-mutedText hover:text-primaryText transition-colors text-sm font-medium">
        <i data-lucide="settings" class="w-5 h-5"></i> Settings
      </a>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="flex-1 flex flex-col relative overflow-hidden">

    <!-- TOP HEADER -->
    <header
      class="h-20 flex items-center justify-between px-8 z-10 glass-effect border-b border-surfaceBorder shrink-0">
      <div class="flex items-center relative w-80">
        <i data-lucide="search" class="w-4 h-4 text-mutedText absolute left-4"></i>
        <input type="text" placeholder="Search system nodes..."
          class="w-full bg-appBg border border-surfaceBorder rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-accentTeal text-primaryText placeholder:text-mutedText transition-colors">
      </div>

      <div class="flex items-center gap-6">
        <div
          class="flex gap-4 border-r border-surfaceBorder pr-6 text-sm font-semibold text-mutedText uppercase tracking-wider">
          <button class="text-accentTeal font-bold flex flex-col items-center gap-1 group">
            Live View <div class="w-8 h-0.5 bg-accentTeal rounded group-hover:w-full transition-all"></div>
          </button>
          <button id="historyTabBtn" class="hover:text-primaryText transition-colors pt-0.5">History</button>
        </div>

        <div class="relative group">
          <button
            class="text-xs font-bold text-primaryText uppercase tracking-widest hover:text-accentTeal transition-colors flex items-center gap-2 py-2">
            <i data-lucide="download" class="w-4 h-4"></i> Export Data
          </button>
          <div
            class="absolute right-0 mt-2 w-36 bg-surfaceBg border border-surfaceBorder rounded-md shadow-[0_4px_20px_rgba(0,0,0,0.5)] opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-20 flex flex-col">
            <button id="exportCsvBtn"
              class="text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-white/5 text-primaryText transition-colors rounded-t-md border-b border-surfaceBorder flex items-center gap-3"><i
                data-lucide="file-spreadsheet" class="w-4 h-4 text-accentTeal"></i> CSV Data</button>
            <button id="exportPdfBtn"
              class="text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-white/5 text-primaryText transition-colors rounded-b-md flex items-center gap-3"><i
                data-lucide="file-text" class="w-4 h-4 text-accentTeal"></i> PDF Report</button>
          </div>
        </div>

        <div class="flex items-center gap-3 pl-4 border-l border-surfaceBorder">
          <div class="text-right">
            <p class="text-xs font-bold text-primaryText">Admin Root</p>
            <p class="text-[10px] text-mutedText">System Administrator</p>
          </div>
          <div
            class="w-8 h-8 rounded-full bg-surfaceBorder flex items-center justify-center overflow-hidden border border-white/10">
            <i data-lucide="user" class="w-4 h-4 text-primaryText"></i>
          </div>
        </div>
      </div>
    </header>

    <!-- SCROLLABLE CONTENT AREA -->
    <main class="flex-1 overflow-y-auto px-8 pb-8 pt-6">

      <!-- ================= DASHBOARD VIEW ================= -->
      <div id="dashboardView" class="flex flex-col">
        <!-- System Overview Title -->
        <div class="mb-6 flex justify-between items-end">
          <div>
            <h2 class="text-2xl font-bold mb-2 text-primaryText">System Overview</h2>
            <div class="flex items-center gap-2 text-sm text-mutedText font-medium">
              <div id="sysDot" class="w-2 h-2 rounded-full bg-safeGreen"></div>
              <span id="sysStatusText">Core Node 01: All systems operational</span>
            </div>
          </div>
          <button id="simBtn"
            class="text-xs font-medium text-mutedText hover:text-white border border-surfaceBorder px-3 py-1.5 rounded-md bg-surfaceBg transition-colors">
            Simulate Test Data
          </button>
        </div>

        <!-- 5 TOP CARDS ROW -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
          <div
            class="glass-effect bg-surfaceBg border border-surfaceBorder rounded-xl p-4 hover:bg-[#27272a] transition-colors flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-medium text-mutedText uppercase">Temp 1</span>
              <i data-lucide="thermometer" class="w-4 h-4 text-mutedText/50"></i>
            </div>
            <div class="flex items-baseline gap-1">
              <span id="t1" class="text-2xl font-bold font-mono text-primaryText">--</span>
              <span class="text-sm text-mutedText">°C</span>
            </div>
          </div>
          <div
            class="glass-effect bg-surfaceBg border border-surfaceBorder rounded-xl p-4 hover:bg-[#27272a] transition-colors flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-medium text-mutedText uppercase">Temp 2</span>
              <i data-lucide="thermometer" class="w-4 h-4 text-mutedText/50"></i>
            </div>
            <div class="flex items-baseline gap-1">
              <span id="t2" class="text-2xl font-bold font-mono text-primaryText">--</span>
              <span class="text-sm text-mutedText">°C</span>
            </div>
          </div>
          <div
            class="glass-effect bg-surfaceBg border border-surfaceBorder rounded-xl p-4 hover:bg-[#27272a] transition-colors flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-medium text-mutedText uppercase">Temp 3</span>
              <i data-lucide="thermometer" class="w-4 h-4 text-mutedText/50"></i>
            </div>
            <div class="flex items-baseline gap-1">
              <span id="t3" class="text-2xl font-bold font-mono text-primaryText">--</span>
              <span class="text-sm text-mutedText">°C</span>
            </div>
          </div>
          <div
            class="glass-effect bg-surfaceBg border border-surfaceBorder rounded-xl p-4 hover:bg-[#27272a] transition-colors flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-medium text-mutedText uppercase">Current</span>
              <i data-lucide="activity" class="w-4 h-4 text-accentTeal/70"></i>
            </div>
            <div class="flex items-baseline gap-1">
              <span id="current" class="text-2xl font-bold font-mono text-primaryText">--</span>
              <span class="text-sm text-mutedText">A</span>
            </div>
          </div>
          <div
            class="glass-effect bg-surfaceBg border border-surfaceBorder rounded-xl p-4 hover:bg-[#27272a] transition-colors flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-medium text-mutedText uppercase"
